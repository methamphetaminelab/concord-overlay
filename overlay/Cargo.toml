[package]
name = "concord-overlay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Wayland voice overlay for the concord Discord TUI client"
publish = false

[dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
